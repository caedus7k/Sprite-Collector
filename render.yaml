services:
  - type: web
    name: Sprite Collector Backend
    env: python
    plan: starter
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: python src/fortnite_app.py
    envVars:
      - key: FLASK_SECRET_KEY
        fromSecret: FLASK_SECRET_KEY
      - key: FORTNITE_API_KEY
        fromSecret: FORTNITE_API_KEY
      - key: EBAY_CLIENT_ID
        fromSecret: EBAY_CLIENT_ID
      - key: EBAY_CLIENT_SECRET
        fromSecret: EBAY_CLIENT_SECRET
      - key: TCGPLAYER_CLIENT_ID
        fromSecret: TCGPLAYER_CLIENT_ID
      - key: TCGPLAYER_CLIENT_SECRET
        fromSecret: TCGPLAYER_CLIENT_SECRET
